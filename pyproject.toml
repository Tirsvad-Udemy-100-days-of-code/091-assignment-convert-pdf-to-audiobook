[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-audiobook"
version = "0.1.0"
description = "Convert a PDF file into an audiobook with text-to-speech (Day 91 assignment)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
keywords = ["pdf", "text-to-speech", "audiobook", "coqui-tts", "udemy"]
dependencies = [
  "pypdf>=5.0",
  "coqui-tts[codec,languages]>=0.28",
  "torch>=2.9",
  "torchaudio>=2.9",
]

[project.scripts]
pdf-to-audiobook = "pdf_to_audiobook.presentation.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
  "slow: runs the real speech engine and needs the voice model (run with -m slow)",
]

[tool.coverage.run]
source = ["src/pdf_to_audiobook"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["TTS", "TTS.*"]
ignore_missing_imports = true
